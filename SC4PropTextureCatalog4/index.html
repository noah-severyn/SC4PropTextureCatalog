<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SC4 Prop Texture Catalog</title>
    <link rel="apple-touch-icon" sizes="180x180" href="ico/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="ico/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="ico/favicon-16x16.png">
    <link rel="manifest" href="ico/site.webmanifest">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <!-- Header automatically inserted. See site.js -->
     
    <main role="main" class="container">
        <h3>Search for props, textures, buildings, or flora by Pack, TGI, Author, or Exemplar Name</h3>

        <form method="get" role="search" id="SearchForm">
            <input id="SearchBox" type="search" placeholder="Search for Pack | TGI | Author | Exemplar Name ...">
            <input type="Submit" value="Search" />
        </form>

        <fieldset class="grid">
            <details class="dropdown" id="Categories">
                <summary>TGI Category</summary>
                <ul>
                    <li><label><input type="checkbox" checked />Buildings</label></li>
                    <li><label><input type="checkbox" checked />Props</label></li>
                    <li><label><input type="checkbox" checked />Textures</label></li>
                    <li><label><input type="checkbox" checked />Flora</label></li>
                    <li><label><input type="checkbox" />Others</label></li>
                </ul>
            </details>

            <label>
                Thumbnail Size
                <input id="ThumbnailSize" type="range" min="0" max="128" step="16" value="0" />
            </label>
        </fieldset>



        <p id="QueryResultSummary">Query "<span id="QuerySearchText"></span>" returned <span id="QueryResultCount"></span> results. <span id="QueryFilterCount"></span> results visible.</p>
        <hr />

        <table id="QueryResultTable">
            <thead>
                <tr class="header">
                    <th>Package Name</th>
                    <th>File</th>
                    <th>TGI</th>
                    <th>Category</th>
                    <th>Author</th>
                    <th class="thumbnail-col">Thumbnail</th>
                    <th>Exemplar Name</th>
                </tr>
            </thead>
            <tbody id="QueryResultBody"></tbody>
        </table>
    </main>


    <script src="js/site.js"></script>
    <script src="js/site-search.js"></script>
    <script src="js/theme-switcher.js"></script>
</body>
</html>
