<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SC4 Prop Texture Catalog</title>
    <link rel="stylesheet" href="css/pico.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/autocomplete.css" />
</head>

<body>
    <header class="container">
        <nav>
            <ul>
                <li class="logo">SC4PropTextureCatalog</li>
                <li><a href="/SC4PropTextureCatalog4/Index.html">Home</a></li>
                <li><a href="/SC4PropTextureCatalog4/ViewPack.html">View a Pack</a></li>
                <li><a href="/SC4PropTextureCatalog4/CompletionStex.html">STEX Status</a></li>
                <li><a href="/SC4PropTextureCatalog4/About.html">About</a></li>
                <li><a href="#" id="theme_switcher"></a></li>
        </nav>
    </header>

    <main role="main" class="container">
        <h3>Choose a prop or texture pack to inspect</h3>
        <p style="color:var(--pico-primary)">Currently only thumbnails for textures are supported. Props/Buildings/Flora to follow.</p>
        <form role="search" id="PackageForm">
            <input type="search" id="PackageSelection" />
            <input type="Submit" value="View Pack" />
        </form>


        <div class="sticky">
            <table>
                <thead>
                    <tr>
                        <th>Pack Name</th>
                        <th>Pack Version</th>
                        <th>Author</th>
                        <th>Type</th>
                        <th># Textures</th>
                        <th># Props</th>
                        <th># Flora</th>
                        <th># Models</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="SelectedPackId"></td>
                        <td id="SelectedPackVersion"></td>
                        <td id="SelectedPackAuthor"></td>
                        <td id="SelectedPackType">Type</td>
                        <td id="SelectedPackTextureCount">00</td>
                        <td id="SelectedPackPropCount">00</td>
                        <td id="SelectedPackFloraCount">00</td>
                        <td id="SelectedPackModelCount">00</td>
                        <td>
                            <input id="BackgroundToggle" type="checkbox" onclick="ToggleDarkThumbnailBg()" />
                            <label for="BackgroundToggle">Dark background</label>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <hr />

        <table id="TextureTable">
            <!-- <tbody>
                @{
                if (Model.TextureCount > 0) {
                for (int row = 0; row < Math.Ceiling(((double) Model.TextureCount) / 10); row++) { <tr>
                    @{
                    for (int col = 0; col < 12; col++) { try { <td>
                        <img src="~/img/thumbnails/@(Model.TextureRecords[row*10 + col].TGI.Replace(" 0x", "" ).Replace(", ", " -")).png" height="64px" loading="lazy" />
                        <p>@(Model.TextureRecords[row * 10 + col].TGI.Substring(Model.TextureRecords[row * 10 + col].TGI.Length - 8))</p>
                        </td>
                        }
                        catch (ArgumentOutOfRangeException) { } //Account for last row where there will be < 12 columns } } </tr>
                            }
                            }
                            }
            </tbody> -->
        </table>

        <table id="PropTable">
        </table>
    </main>


    <!--<script src="js/site.js"></script>
    <script src="js/site-events.js"></script>-->
    <script src="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@10.2.9/dist/autoComplete.min.js"></script>
    <script src="js/site-package-search.js"></script>
    <script src="js/theme-switcher.js"></script>
</body>
</html>
